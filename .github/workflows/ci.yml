name: CI

on:
  push:
    branches: [main]
  # No branch filter on purpose: pull requests in a stack target other feature branches, and should be checked too.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches nixpacks.toml (Railway)
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The test suite and requirements-dev.txt arrive with the backend-tests PR; skip cleanly until they exist.
      - name: Install dependencies
        if: hashFiles('requirements-dev.txt') != ''
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        if: hashFiles('requirements-dev.txt') != ''
        run: python -m pytest -q
        env:
          # Dummy values; every external service is mocked in the tests.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-key
          ANTHROPIC_API_KEY: test-key
          YOUTUBE_API_KEY: test-key

      # Always at least prove the backend imports, even before tests exist.
      - name: Import check
        run: |
          python -m pip install -r requirements.txt
          python -c "import backend.main"
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-key
          ANTHROPIC_API_KEY: test-key
          YOUTUBE_API_KEY: test-key

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        if: hashFiles('frontend/*.test.js') != ''
        run: npm test

      - name: Expo config and dependency check
        run: npx expo-doctor

      - name: Bundle the app (catches syntax errors and bad imports)
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export"
